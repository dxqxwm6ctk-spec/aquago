<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaGo Control · لوحة المالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="control.css">
</head>
<body>

<div class="shell">

  <!-- الشريط الجانبي -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <div class="brand-name">Aqua<span>Go</span></div>
        <div class="brand-tag">CONTROL · OWNER</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-item" data-page="exec">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19h16"></path><path d="M6 19V9m6 10V5m6 14v-7"></path></svg>
        <span>اللوحة التنفيذية</span>
      </div>
      <div class="nav-item" data-page="team">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.4"></circle><path d="M3 20c1-3.4 3.4-4.8 6-4.8s5 1.4 6 4.8"></path><path d="M16.5 6.5a3 3 0 0 1 0 6M18 20c-.4-1.7-1-2.9-1.8-3.8"></path></svg>
        <span>المديرون والصلاحيات</span>
      </div>
      <div class="nav-item" data-page="money">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3.5"></rect><path d="M16.5 12.5h.01"></path></svg>
        <span>المالية والتسعير</span>
      </div>
      <div class="nav-item" data-page="control">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 8h14M5 16h14"></path><circle cx="9" cy="8" r="2.4"></circle><circle cx="15" cy="16" r="2.4"></circle></svg>
        <span>التحكم بالمنصة</span>
      </div>
      <div class="nav-item" data-page="audit">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
        <span>سجل التغييرات</span>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <div class="cities-live">
        <div class="live-row">
          <span class="live-dot"><span class="live-dot-core"></span><span class="live-dot-ripple"></span></span>
          <div class="live-title">3 مدن تعمل</div>
        </div>
        <div class="live-sub">عمّان · إربد · الزرقاء (تجريبي)</div>
      </div>
      <div class="owner-row">
        <div class="owner-avatar">ح</div>
        <div class="owner-info">
          <div class="owner-name">الحسن — المالك</div>
          <div class="owner-role">صلاحية كاملة</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- المنطقة الرئيسية -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title" id="pageTitle">اللوحة التنفيذية</div>
        <div class="page-note" id="pageNote">مؤشرات المشروع الكاملة · تحديث لحظي</div>
      </div>
      <div class="topbar-actions">
        <div class="city-filter" id="cityFilter">
          <div class="city-chip active" data-city="all">كل المدن</div>
          <div class="city-chip" data-city="amman">عمّان</div>
          <div class="city-chip" data-city="irbid">إربد</div>
          <div class="city-chip" data-city="zarqa">الزرقاء</div>
        </div>
        <div class="export-btn">تصدير تقرير</div>
      </div>
    </header>

    <main class="content" id="content">
      <!-- الشاشات تُحقن هنا عبر control.js -->
    </main>
  </div>
</div>

<script src="control.js"></script>
</body>
</html>
